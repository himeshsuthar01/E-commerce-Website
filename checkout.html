
<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Checkout | MAISON AUREA</title>

    <!-- GOOGLE FONTS -->
    <link
        href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;600&family=Playfair+Display:wght@400;500;600&display=swap"
        rel="stylesheet"
    >

    <!-- BOOTSTRAP 5.3.3 -->
    <link
        href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
        rel="stylesheet"
    >

    <!-- CUSTOM CSS -->
    <link rel="stylesheet" href="style.css">

</head>

<body>

    <!-- ANNOUNCEMENT BAR -->
    <div class="announcement">
        A CONSIDERED EXPERIENCE, FROM START TO FINISH
    </div>


    <!-- NAVBAR -->
    <nav class="navbar main-nav">

        <div class="container justify-content-center">

            <a class="navbar-brand" href="index.html">

                MAISON <span>AUREA</span>

                <small>CONSIDERED LUXURY</small>

            </a>

        </div>

    </nav>


    <!-- CHECKOUT MAIN SECTION -->
    <main class="page-main checkout-main">

        <!-- PAGE HEADING -->
        <div class="page-heading">

            <p class="eyebrow">ALMOST YOURS</p>

            <h1>Make it yours.</h1>

            <p>Complete your details to continue.</p>

        </div>


        <!-- CHECKOUT CONTENT -->
        <div class="row g-5">

            <!-- LEFT SIDE: CHECKOUT FORM -->
            <div class="col-lg-7">

                <form id="checkoutForm" class="checkout-form">

                    <!-- CONTACT INFORMATION -->
                    <h2>Contact information</h2>

                    <label>
                        Email address

                        <input
                            type="email"
                            required
                            placeholder="you@example.com"
                        >

                    </label>


                    <!-- DELIVERY ADDRESS -->
                    <h2>Delivery address</h2>

                    <div class="row g-3">

                        <!-- FIRST NAME -->
                        <div class="col-md-6">

                            <label>
                                First name

                                <input
                                    required
                                    placeholder="First name"
                                >

                            </label>

                        </div>


                        <!-- LAST NAME -->
                        <div class="col-md-6">

                            <label>
                                Last name

                                <input
                                    required
                                    placeholder="Last name"
                                >

                            </label>

                        </div>


                        <!-- ADDRESS -->
                        <div class="col-12">

                            <label>
                                Address

                                <input
                                    required
                                    placeholder="House number and street"
                                >

                            </label>

                        </div>


                        <!-- CITY -->
                        <div class="col-md-6">

                            <label>
                                City

                                <input
                                    required
                                    placeholder="City"
                                >

                            </label>

                        </div>


                        <!-- POSTAL CODE -->
                        <div class="col-md-6">

                            <label>
                                Postal code

                                <input
                                    required
                                    pattern="[0-9]{6}"
                                    placeholder="6-digit PIN code"
                                >

                            </label>

                        </div>


                        <!-- PHONE NUMBER -->
                        <div class="col-12">

                            <label>
                                Phone number

                                <input
                                    type="tel"
                                    required
                                    pattern="[0-9]{10}"
                                    placeholder="10-digit mobile number"
                                >

                            </label>

                        </div>

                    </div>


                    <!-- PAYMENT METHOD -->
                    <h2>Payment method</h2>

                    <label class="payment-option">

                        <input
                            type="radio"
                            name="payment"
                            checked
                        >

                        Cash on delivery (demo)

                    </label>


                    <!-- PLACE ORDER BUTTON -->
                    <button
                        class="btn-aurea w-100 justify-content-between mt-4"
                        type="submit"
                    >

                        PLACE DEMO ORDER

                        <span>↗</span>

                    </button>


                    <!-- CHECKOUT MESSAGE -->
                    <p
                        id="checkoutMessage"
                        class="form-message mt-3"
                    ></p>

                </form>

            </div>


            <!-- RIGHT SIDE: ORDER SUMMARY -->
            <div class="col-lg-5">

                <aside class="summary-box">

                    <p class="eyebrow">YOUR ORDER</p>


                    <!-- CHECKOUT ITEMS -->
                    <div id="checkoutItems"></div>

                    <hr>


                    <!-- SUBTOTAL -->
                    <div class="summary-line">

                        <span>Subtotal</span>

                        <strong id="checkoutSubtotal">₹0</strong>

                    </div>


                    <!-- SHIPPING -->
                    <div class="summary-line">

                        <span>Shipping</span>

                        <span>Complimentary</span>

                    </div>


                    <!-- TOTAL -->
                    <div class="summary-line total">

                        <span>Total</span>

                        <strong id="checkoutTotal">₹0</strong>

                    </div>

                </aside>

            </div>

        </div>

    </main>


    <!-- FOOTER -->
    <div id="siteFooter"></div>


    <!-- BOOTSTRAP JAVASCRIPT -->
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>

    <!-- CUSTOM JAVASCRIPT -->
    <script src="script.js"></script>

</body>

</html>
